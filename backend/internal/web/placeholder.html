    <title>Noto</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;

  <body>

      <h1>Noto</h1>
      <p>The frontend has not been built yet.</p>
      <p>
        Build it with <code>npm run build</code> in the <code>frontend/</code>
        directory and copy the result into
        <code>backend/internal/web/dist</code>, or start the server with
        <code>NOTO_STATIC_DIR</code> pointing at the built assets.

      <p>The REST API is available below <code>/api</code>.</p>
